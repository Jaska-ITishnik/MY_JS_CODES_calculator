<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Java script</title>
  <link rel="stylesheet" href="style.css">
 <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
 <script src="main.js" defer></script>
</head>
<body>
<div class="dom-example none"></div>
<div class="simple-todo none"></div>
<div class="fetch-example none"></div>

<div class="card">
  <h1>Calculator</h1>
<div class="numbers">
  <input
  type="number"
  class="form-control mb-2"
  placeholder="Edit 1 number"
  id="input1"
  value="10"
  />
  <input
  type="number"
  class="form-control mb-2"
  placeholder="Edit 2 number"
  id="input2"
  value="15"
  />
</div>

<div class="actions">
 <button class="card_plus" id="plus"><strong>+</strong></button>
 <button class="card_minus" id="minus"><strong>-</strong></button>
</div>

<div class="actions">
  <button class="card_plus" id="multiply"><strong>*</strong></button>
  <button class="card_minus" id="subtract"><strong>/</strong></button>
</div>

<div class="actions">
  <button class="card_plus" id="degree"><strong>a^b</strong></button>
  <button class="card_minus" id="cos"><strong>cos</strong></button>
</div>

<button class="solve" id="submit"><strong>Calculation</strong> </button>
<div class="card_result" placeholder="Result:" id="result">
 <strong>...</strong>
</div>
</div>



</body>
